<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Confirm your IronPath email</title>
  </head>
  <body style="margin:0;padding:0;background-color:#09090b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#09090b;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding:0 0 10px 0;">
                <img src="https://images.weserv.nl/?url=www.tryironpath.com/logos/ironpath-logo-static.svg&amp;output=png&amp;w=256" width="80" height="80" alt="IronPath" style="display:block;border:0;width:80px;height:80px;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 0 24px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.22em;color:#a3e635;">
                IRONPATH
              </td>
            </tr>
            <tr>
              <td style="background-color:#18181b;border:1px solid #27272a;border-radius:12px;padding:32px 28px;">
                <h1 style="margin:0 0 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:600;color:#ffffff;">
                  Confirm your email
                </h1>
                <p style="margin:0 0 24px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#a1a1aa;">
                  Confirm this email address to finish creating your IronPath account.
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td style="border-radius:8px;background-color:#a3e635;">
                            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1;color:#09090b;text-decoration:none;">
                              Confirm email
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 8px 0 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#71717a;">
                Questions: <a href="mailto:support@tryironpath.com" style="color:#a1a1aa;text-decoration:none;">support@tryironpath.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
